name: Checks and publish

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.14"
          python-version: "3.13.7"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check app tests
      - run: uv run ruff check app tests
      - run: uv run mypy app
      - run: uv run pytest

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  publish:
    needs: [backend-checks, frontend-checks]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate ref and select build version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || {
              echo "Only stable vX.Y.Z tags can be published." >&2
              exit 1
            }
            echo "value=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "image_tags=ghcr.io/nikkzhur/render-node:${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0" >> "$GITHUB_OUTPUT"
            echo "image_tags=ghcr.io/nikkzhur/render-node:latest,ghcr.io/nikkzhur/render-node:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build release bundle
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
          scripts/build-release-bundle.sh "${{ steps.version.outputs.value }}" dist
      - name: Create stable GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/render-node-linux-x64.tar.gz \
            dist/render-node-linux-x64.tar.gz.sha256 \
            --verify-tag --title "Render Node $GITHUB_REF_NAME" \
            --generate-notes --latest --draft=false --prerelease=false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish prepared image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.version.outputs.image_tags }}
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
