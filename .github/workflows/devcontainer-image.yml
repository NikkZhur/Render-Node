name: Build devcontainer image

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer-image.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: devcontainer-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish devcontainer
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/nikkzhur/render-node-dev
          imageTag: sha-${{ github.sha }}
          platform: linux/amd64
          push: always

      - name: Add image name to workflow summary
        shell: bash
        run: |
          echo "### RunPod image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`ghcr.io/nikkzhur/render-node-dev:sha-${GITHUB_SHA}\`" \
            >> "$GITHUB_STEP_SUMMARY"
