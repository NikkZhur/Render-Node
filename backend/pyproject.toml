[project]
name = "render-node-backend"
version = "0.1.0"
description = "Single-node Blender render service backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "aiosqlite>=0.20,<1",
  "aiofiles>=24.1,<26",
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "nvidia-ml-py>=13.580,<14",
  "pillow>=11.3,<13",
  "psutil>=7.0,<8",
  "pydantic-settings>=2.7,<3",
  "python-dotenv>=1,<2",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
  "zstandard>=0.23,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
  "types-aiofiles>=24.1,<26",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]
"tests/*.py" = ["S101", "S314"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pynvml"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "psutil"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.blender.adapters.*"
ignore_errors = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
